he final syllable is IH K, but it is unstressed and the main stress is on the first syllable."}},{"id":"debuts|UW Z","word":"debuts","seed":"booze","say":"BOO-z","tier":false,"kind":"stress","engine":"DAY-byoo-z","ruling":{"word":"debuts","verdict":"rhymes","reading":"D EY0 B Y UW1 Z","why":"Americans commonly say day-BYOOZ with stress on the last syllable, which ends in UW Z.","confidence":"medium","verified":true}},{"id":"cherish|IH SH","word":"cherish","seed":"dish","say":"DIH-sh","tier":false,"kind":"stress","engine":"CHEH-rih-sh","ruling":{"word":"cherish","verdict":"weak","reading":"CH EH1 R IH0 SH","confidence":"high","why":"The final syllable is IH SH, but it is unstressed and the stress is on CHER-."}},{"id":"issues|UW Z","word":"issues","seed":"booze","say":"BOO-z","tier":false,"kind":"stress","engine":"IH-shoo-z","ruling":{"word":"issues","verdict":"weak","reading":"IH1 SH UW0 Z","why":"The final syllable -sues has the sounds UW Z but is unstressed, with stress on the first syllable.","confidence":"medium"}},{"id":"gothic|IH K","word":"gothic","seed":"trick","say":"TRIH-k","tier":false,"kind":"stress","engine":"GAH-thih-k","ruling":{"word":"gothic","verdict":"weak","reading":"G AA1 TH IH0 K","confidence":"high","why":"Its final syllable is IH K, matching the key, but the stress falls on the first syllable."}},{"id":"tantric|IH K","word":"tantric","seed":"trick","say":"TRIH-k","tier":false,"kind":"stress","engine":"TA-ntrih-k","ruling":{"word":"tantric","verdict":"weak","reading":"T AE1 N T R IH0 K","confidence":"high","why":"The final syllable is IH K, but it is unstressed and the stress is on TAN-."}},{"id":"unbored|AO R D","word":"unbored","seed":"landlord","say":"LA-ndlaw-rd","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"unbored","verdict":"rhymes","reading":"AH1 N B AO2 R D","confidence":"medium","why":"The compound un+bored keeps secondary stress on AO and ends in AO R D, like landlord.","verified":true}},{"id":"pawl|AA L","word":"pawl","seed":"wall","say":"WAH-l","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"pawl","verdict":"rhymes","reading":"P AA1 L","confidence":"high","why":"A pawl is a real word (the ratchet catch), and in merged General American it is the same as wall.","verified":true}},{"id":"askews|UW Z","word":"askews","seed":"booze","say":"BOO-z","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"askews","verdict":"not-a-word","reading":null,"why":"Askew is an adverb or adjective with no plural, so askews is not an English word.","confidence":"high"}},{"id":"heartsick|IH K","word":"heartsick","seed":"trick","say":"TRIH-k","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"heartsick","verdict":"rhymes","reading":"HH AA1 R T S IH2 K","confidence":"high","why":"Compound with secondary stress on -sick, so it ends in the stressed IH K, like homesick.","verified":true}},{"id":"smocked|AA K T","word":"smocked","seed":"shellshocked","say":"SHEH-lshah-kt","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"smocked","verdict":"rhymes","reading":"S M AA1 K T","confidence":"high","why":"Past tense of smock, a real verb used in needlework, and it ends in AA K T like shellshocked.","verified":true}},{"id":"whin|IH N","word":"whin","seed":"win","say":"WIH-n","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"whin","verdict":"rhymes","reading":"W IH1 N","confidence":"medium","why":"Whin (gorse) is a real English word, and in General American it is pronounced like win.","verified":true}},{"id":"pedometer|IY T ER","word":"pedometer","seed":"centimeter","say":"SEH-ntuh-mee-tur","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"pedometer","verdict":"no-rhyme","reading":"P IH0 D AA1 M AH0 T ER0","why":"Stress is on -dom-, and the final -meter is unstressed, so the key is AA M AH T ER.","confidence":"high"}},{"id":"shrews|UW Z","word":"shrews","seed":"booze","say":"BOO-z","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"shrews","verdict":"rhymes","reading":"SH R UW1 Z","confidence":"high","why":"Plural of shrew, a real word pronounced SH R UW1 Z, which ends in the key UW Z.","verified":true}},{"id":"beanstalks|AA K S","word":"beanstalks","seed":"smallpox","say":"SMAH-lpah-ks","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"beanstalks","verdict":"rhymes","reading":"B IY1 N S T AA2 K S","confidence":"high","why":"Plural of beanstalk, a real word whose last stressed vowel is AA2 followed by K S, the same key as smallpox.","verified":true}},{"id":"doormug|AH G","word":"doormug","seed":"mug","say":"MUH-g","tier":false,"kind":"no-reading","engine":"no reading","ruling":{"word":"doormug","verdict":"not-a-word","reading":null,"confidence":"medium","why":"It is just door and mug run together, with no dictionary entry."}},{"id":"norse|tier","word":"norse","seed":"horse","say":null,"tier":true,"kind":"tier","engine":"NAW-rs","ruling":{"word":"norse","verdict":"not-a-word","reading":null,"confidence":"medium","why":"Norse is a proper adjective/name for a people and language (capitalized), not an ordinary rhyme-hunt word."}},{"id":"jews|tier","word":"jews","seed":"booze","say":null,"tier":true,"kind":"tier","engine":"JOO-z","ruling":{"word":"jews","verdict":"not-a-word","reading":null,"confidence":"medium","why":"Capitalized proper-noun ethnonym, not a common rhyme answer, and the lowercase form is also a verb 'jew' that is offensive."}},{"id":"grander|tier","word":"grander","seed":"commander","say":null,"tier":true,"kind":"tier","engine":"GRA-ndur","ruling":{"word":"grander","verdict":"answer","reading":"G R AE1 N D ER0","confidence":"medium","why":"Common comparative of 'grand' that rhymes cleanly with commander and a player would plausibly offer it."}},{"id":"crim|tier","word":"crim","seed":"him","say":null,"tier":true,"kind":"tier","engine":"KRIH-m","ruling":{"word":"crim","verdict":"bonus","reading":"K R IH1 M","confidence":"medium","why":"Only a clipped slang abbreviation of 'criminal' that few players would produce."}}];
const KEY = "PROTOTYPE-judge-labels-" + SET;
const RHYME = [["rhymes", "Rhymes: should count"], ["weak", "Weak: same sounds, stress falls earlier"], ["no-rhyme", "Does not rhyme"], ["not-a-word", "Not a word, or a name"], ["unsure", "Unsure"]];
const TIER = [["answer", "Answer"], ["bonus", "Bonus Word"], ["not-a-word", "Not a word, or a name"], ["unsure", "Unsure"]];
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let at = Math.max(0, ITEMS.findIndex((it) => !labels[it.id]));
if (ITEMS.every((it) => labels[it.id])) at = ITEMS.length - 1;
const options = (it) => (it.tier ? TIER : RHYME);

function rule(label) {
  labels[ITEMS[at].id] = label;
  localStorage.setItem(KEY, JSON.stringify(labels));
  if (at < ITEMS.length - 1) at++;
  render();
}
function render() {
  const it = ITEMS[at], done = ITEMS.filter((x) => labels[x.id]).length;
  document.getElementById("progress").textContent = "Pair " + (at + 1) + " of " + ITEMS.length + ". Ruled: " + done + (done === ITEMS.length ? ". All done: press Export labels." : "");
  const q = it.tier
    ? "The game accepts this as a <b>Bonus Word</b> (unscored). Would a player hunting rhymes think of it, so that it should be an Answer?"
    : "Does <b>" + it.word + "</b> rhyme with the Seed Word in General American?";
  const r = it.ruling;
  document.getElementById("card").innerHTML =
    '<div class="pair">' + it.word + ' <span class="say">for</span> <b>' + it.seed + '</b> <span class="say">' + (it.say ? "(" + it.say + ")" : "") + "</span></div>" +
    '<div class="q">' + q + "</div>" +
    (r ? '<div class="ruling">Judge: <b>' + r.verdict + "</b> (" + r.confidence + ")" + (r.reading ? ", reading <code>" + r.reading + "</code>" : "") + "<br>" + r.why + "<br><span class=say>Engine: " + it.kind + ", reads it " + it.engine + "</span></div>" : "") +
    options(it).map(([v, text], i) => '<button data-v="' + v + '" class="' + (labels[it.id] === v ? "on" : "") + '"><kbd>' + (i + 1) + "</kbd>" + text + "</button>").join("");
  document.querySelectorAll("#card button").forEach((b) => (b.onclick = () => rule(b.dataset.v)));
  const tally = {};
  Object.values(labels).forEach((l) => (tally[l] = (tally[l] || 0) + 1));
  document.getElementById("tally").textContent = Object.entries(tally).map(([l, n]) => l + " " + n).join(", ") || "none yet";
  document.getElementById("log").innerHTML = ITEMS.filter((x) => labels[x.id]).slice(-12).reverse()
    .map((x) => "<tr><td>" + x.word + "</td><td>for " + x.seed + "</td><td><b>" + labels[x.id] + "</b></td></tr>").join("");
}
document.getElementById("back").onclick = () => { at = Math.max(0, at - 1); render(); };
document.getElementById("next").onclick = () => { at = Math.min(ITEMS.length - 1, at + 1); render(); };
document.getElementById("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(labels, null, 1)], { type: "application/json" }));
  a.download = SET + ".labels.json";
  a.click();
};
document.onkeydown = (e) => {
  const it = ITEMS[at], n = Number(e.key);
  if (n >= 1 && n <= options(it).length) rule(options(it)[n - 1][0]);
  else if (e.key === "Enter") { if (it.ruling && !labels[it.id]) rule(it.ruling.verdict); else document.getElementById("next").click(); }
  else if (e.key === "Backspace") document.getElementById("back").click();
};
render();
</script>
